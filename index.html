<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Values in {{…}} come from src/config/site.js (see siteHtmlPlugin in vite.config.js).
         Per-route title/description/canonical/og:* are set at runtime by usePageMeta. -->
    <title>{{site.name}} | {{site.tagline}}</title>
    <meta name="description" content="משרד עורכי דין ערן בקר — מומחים בנזיקין, ביטוח, רשלנות רפואית וביטוח לאומי. מדורגים DUNS 100 ו-BDi CODE. ייעוץ ראשוני אישי ללא התחייבות." />
    <meta name="theme-color" content="#0a0f16" />
    <link rel="canonical" href="{{site.origin}}/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{site.name}}" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:title" content="{{site.name}} | {{site.tagline}}" />
    <meta property="og:description" content="משרד עורכי דין ערן בקר — מומחים בנזיקין, ביטוח, רשלנות רפואית וביטוח לאומי. ייעוץ ראשוני אישי ללא התחייבות." />
    <meta property="og:url" content="{{site.origin}}/" />
    <meta property="og:image" content="{{site.origin}}{{site.ogImage}}" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <!-- Google Analytics is loaded at runtime by src/lib/analytics.js, only after cookie consent. -->
    {{jsonld}}
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
